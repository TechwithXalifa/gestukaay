[project]
name = "gestukaay-backend"
version = "0.1.0"
description = "API Gëstukaay (FastAPI) : expose le moteur au web et aux canaux"
requires-python = ">=3.12"
dependencies = ["gestukaay-contracts", "gestukaay-engine", "fastapi>=0.115", "uvicorn>=0.30"]

[dependency-groups]
dev = ["httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gestukaay_backend"]
