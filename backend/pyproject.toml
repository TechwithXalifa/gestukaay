[project]
name = "gestukaay-backend"
version = "0.1.0"
description = "API Gëstukaay (FastAPI) : expose le moteur au web et aux canaux"
requires-python = ">=3.12"
dependencies = [
    "gestukaay-contracts",
    "gestukaay-engine",
    "gestukaay-socle",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "fpdf2>=2.8",
    "python-multipart>=0.0.9",
    "psycopg[binary]>=3.2",
]

[dependency-groups]
dev = ["httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gestukaay_backend"]
