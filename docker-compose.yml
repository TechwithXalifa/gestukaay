# Lancer toute l'application :  docker compose up --build
# Site : http://localhost:3000 · API : http://localhost:8000/docs
services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports: ["8000:8000"]
    environment:
      GESTUKAAY_MOTEUR: ${GESTUKAAY_MOTEUR:-fake}
      GESTUKAAY_URL_PUBLIQUE: ${GESTUKAAY_URL_PUBLIQUE:-http://localhost:3000}
      # Dans le conteneur, le socle est toujours ici (monté ci-dessous)
      GESTUKAAY_SOCLE_EXTRAIT: /socle
      # Réponses, journal et retours (stockage.py). GESTUKAAY_ADMIN_JETON (dans .env)
      # ouvre /admin/journal ; sans lui, le back-office est fermé.
      GESTUKAAY_BASE: postgresql://gestukaay:${POSTGRES_PASSWORD:-gestukaay}@db:5432/gestukaay
      GESTUKAAY_ADMIN_JETON: ${GESTUKAAY_ADMIN_JETON:-}
    # Clés du moteur (LLM_PRINCIPAL_CLE…) : dans .env, jamais dans Git
    env_file:
      - path: .env
        required: false
    # Socle extrait (#4, décision 0006), en lecture seule. Le chemin sur la
    # machine vient de GESTUKAAY_SOCLE_EXTRAIT (défaut : ../socle_gestukaay).
    # Avec le faux moteur, un dossier vide suffit.
    volumes:
      - ${GESTUKAAY_SOCLE_EXTRAIT:-../socle_gestukaay}:/socle:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports: ["3000:3000"]
    depends_on:
      api:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: gestukaay
      POSTGRES_DB: gestukaay
      # Valeur de développement. En préproduction : POSTGRES_PASSWORD dans .env
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gestukaay}
    volumes:
      - base:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gestukaay -d gestukaay"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  base:
