[project]
name = "gestukaay"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["gestukaay-backend", "gestukaay-canaux", "gestukaay-contracts", "gestukaay-engine", "gestukaay-socle"]

[tool.uv.workspace]
members = ["backend", "canaux", "contracts", "engine", "socle"]

[tool.uv.sources]
gestukaay-backend = { workspace = true }
gestukaay-canaux = { workspace = true }
gestukaay-contracts = { workspace = true }
gestukaay-engine = { workspace = true }
gestukaay-socle = { workspace = true }

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "httpx>=0.27"]

[tool.ruff]
line-length = 100
target-version = "py312"
# Notebook Kaggle : copie des serveurs de voix et code propre à Kaggle, exécuté là-bas seulement
extend-exclude = ["deploiement/*.ipynb"]

[tool.pytest.ini_options]
testpaths = ["backend/tests", "canaux/tests", "contracts/tests", "engine/tests", "socle/tests", "mesure/tests"]
