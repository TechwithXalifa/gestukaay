[project]
name = "gestukaay-canaux"
version = "0.1.0"
description = "Canaux WhatsApp et Telegram de Gëstukaay : lire, interpréter, formater, envoyer (décision 0025)"
requires-python = ">=3.12"
dependencies = [
    "gestukaay-backend",
    "gestukaay-contracts",
    "gestukaay-engine",
    "httpx>=0.28.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gestukaay_canaux"]
