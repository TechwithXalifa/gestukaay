[project]
name = "gestukaay-contracts"
version = "1.4.0"
description = "Contrat d'échange Gëstukaay (moteur <-> backend <-> web <-> canaux)"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gestukaay_contracts"]
