[project]
name = "gestukaay-engine"
version = "0.1.0"
description = "Moteur Gëstukaay : compréhension (LLM) + résolution déterministe sur le socle"
requires-python = ">=3.12"
dependencies = ["gestukaay-contracts"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gestukaay_engine"]
